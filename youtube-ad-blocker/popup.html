<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    
    .subtitle {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }
    
    .stats {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .stat-item:last-child {
      margin-bottom: 0;
    }
    
    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .stat-value {
      font-size: 16px;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .btn {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ee5a52);
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #ff5252, #e53935);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 82, 82, 0.4);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }
    
    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      opacity: 0.7;
    }
    
    .status {
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      margin-top: 8px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      margin-right: 6px;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">YouTube Ad Blocker</h1>
    <p class="subtitle">Background Protection Active</p>
    <div class="status">
      <div class="status-dot"></div>
      <span id="status-text">Extension Active</span>
    </div>
  </div>
  
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Ads Blocked:</span>
      <span class="stat-value" id="blocked-count">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Session Time:</span>
      <span class="stat-value" id="session-time">0m</span>
    </div>
  </div>
  
  <div class="actions">
    <button class="btn btn-primary" id="goto-youtube">Go to YouTube</button>
    <button class="btn btn-primary" id="manual-block">Block Ad Now</button>
    <button class="btn btn-secondary" id="reset-counter">Reset Counter</button>
  </div>
  
  <div class="footer">
    <p>Extension works automatically in background. Use "Block Ad Now" for manual blocking.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
