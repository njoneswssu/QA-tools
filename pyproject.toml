[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supreme-checkout"
version = "0.1.0"
description = "Supreme auto add-to-cart: load preview products, pick item/size, add to cart with human-like delays."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Supreme Checkout" }]
keywords = ["supreme", "playwright", "nicegui", "checkout", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "nicegui>=1.4.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "build>=0.10",
]

[project.scripts]
supreme-checkout = "supreme_checkout.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["supreme_checkout*"]
