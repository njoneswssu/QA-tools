<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Details - AI Betting Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="index.html" style="text-decoration: none; color: inherit;">🎯 AI Betting Model Dashboard</a></h1>
            <button onclick="window.location.href='index.html'" class="btn btn-secondary">← Back to Games</button>
        </header>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading game details...</p>
        </div>

        <div id="gameDetails" style="display: none;">
            <!-- Game details will be inserted here -->
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Get game ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        if (!gameId) {
            document.getElementById('gameDetails').innerHTML = '<div class="empty-state"><h2>Game not found</h2><p>Please select a game from the main page.</p></div>';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameDetails').style.display = 'block';
        } else {
            loadGameDetails(gameId);
        }

        async function loadGameDetails(gameId) {
            try {
                const response = await fetch(`/api/games/${gameId}`);
                if (!response.ok) throw new Error('Failed to load game details');
                
                const game = await response.json();
                renderGameDetails(game);
            } catch (error) {
                console.error('Error loading game details:', error);
                document.getElementById('gameDetails').innerHTML = `<div class="empty-state"><h2>Error</h2><p>${error.message}</p></div>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('gameDetails').style.display = 'block';
            }
        }

        function renderGameDetails(game) {
            const container = document.getElementById('gameDetails');
            
            // Group betting lines by type (spread, total, player props)
            const spreads = [];
            const totals = [];
            const playerProps = [];
            
            (game.lines || []).forEach(line => {
                if (line.stat_type === 'spread' || line.stat_type === 'moneyline') {
                    spreads.push(line);
                } else if (line.stat_type === 'total' || line.stat_type === 'over_under') {
                    totals.push(line);
                } else {
                    playerProps.push(line);
                }
            });
            
            container.innerHTML = `
                <div class="game-detail-card">
                    <div class="game-header-large">
                        <div>
                            <h2>${escapeHtml(game.away_team)} vs ${escapeHtml(game.home_team)}</h2>
                            <div class="game-date">
                                ${formatDate(game.game_date)} ${game.game_time ? `• ${game.game_time}` : ''}
                            </div>
                        </div>
                        <div class="game-status">${game.status || 'Scheduled'}</div>
                    </div>

                    ${spreads.length > 0 ? `
                        <div class="betting-section">
                            <h3>📊 Spreads & Moneyline</h3>
                            <div class="betting-lines-grid">
                                ${spreads.map(line => `
                                    <div class="betting-line-card">
                                        <div class="sportsbook-name">${escapeHtml(line.sportsbook)}</div>
                                        <div class="line-details">
                                            ${line.stat_type === 'spread' ? `
                                                <div class="line-item">
                                                    <span class="team-name">${escapeHtml(game.away_team)}</span>
                                                    <span class="line-value">${line.line > 0 ? '+' : ''}${line.line}</span>
                                                    ${line.over_odds ? `<span class="odds">${line.over_odds > 0 ? '+' : ''}${line.over_odds}</span>` : ''}
                                                </div>
                                                <div class="line-item">
                                                    <span class="team-name">${escapeHtml(game.home_team)}</span>
                                                    <span class="line-value">${line.line < 0 ? '' : '-'}${Math.abs(line.line)}</span>
                                                    ${line.under_odds ? `<span class="odds">${line.under_odds > 0 ? '+' : ''}${line.under_odds}</span>` : ''}
                                                </div>
                                            ` : `
                                                <div class="line-item">
                                                    <span class="team-name">${escapeHtml(game.away_team)}</span>
                                                    <span class="line-value">${line.line > 0 ? '+' : ''}${line.line}</span>
                                                </div>
                                                <div class="line-item">
                                                    <span class="team-name">${escapeHtml(game.home_team)}</span>
                                                    <span class="line-value">${line.line > 0 ? '+' : ''}${line.line}</span>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${totals.length > 0 ? `
                        <div class="betting-section">
                            <h3>📈 Totals (Over/Under)</h3>
                            <div class="betting-lines-grid">
                                ${totals.map(line => `
                                    <div class="betting-line-card">
                                        <div class="sportsbook-name">${escapeHtml(line.sportsbook)}</div>
                                        <div class="line-details">
                                            <div class="line-item">
                                                <span class="line-label">Total</span>
                                                <span class="line-value">${line.line}</span>
                                            </div>
                                            ${line.over_odds || line.under_odds ? `
                                                <div class="line-item">
                                                    <span class="odds over-odds">Over: ${line.over_odds ? (line.over_odds > 0 ? '+' : '') + line.over_odds : 'N/A'}</span>
                                                    <span class="odds under-odds">Under: ${line.under_odds ? (line.under_odds > 0 ? '+' : '') + line.under_odds : 'N/A'}</span>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${playerProps.length > 0 ? `
                        <div class="betting-section">
                            <h3>👤 Player Props</h3>
                            <div class="player-props-list">
                                ${groupPlayerProps(playerProps).map(([playerName, props]) => `
                                    <div class="player-prop-group">
                                        <h4 class="player-prop-name">${escapeHtml(playerName)}</h4>
                                        <div class="props-grid">
                                            ${props.map(prop => `
                                                <div class="prop-card">
                                                    <div class="prop-header">
                                                        <span class="prop-stat">${prop.stat_type.charAt(0).toUpperCase() + prop.stat_type.slice(1)}</span>
                                                        <span class="prop-sportsbook">${escapeHtml(prop.sportsbook)}</span>
                                                    </div>
                                                    <div class="prop-line">Line: ${prop.line}</div>
                                                    ${prop.over_odds || prop.under_odds ? `
                                                        <div class="prop-odds">
                                                            ${prop.over_odds ? `<span class="over-odds">O: ${prop.over_odds > 0 ? '+' : ''}${prop.over_odds}</span>` : ''}
                                                            ${prop.under_odds ? `<span class="under-odds">U: ${prop.under_odds > 0 ? '+' : ''}${prop.under_odds}</span>` : ''}
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : '<div class="empty-state"><p>No betting lines available for this game.</p></div>'}
                </div>
            `;
        }

        function groupPlayerProps(props) {
            const grouped = new Map();
            props.forEach(prop => {
                if (!grouped.has(prop.player)) {
                    grouped.set(prop.player, []);
                }
                grouped.get(prop.player).push(prop);
            });
            return Array.from(grouped.entries());
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return 'TBD';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric',
                year: 'numeric'
            });
        }
    </script>
</body>
</html>
