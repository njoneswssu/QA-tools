<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlink Proxy Monitor - Log Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
        .detail-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .method-badge {
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 25px;
        }
        .status-badge {
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 25px;
        }
        .code-block {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .json-viewer {
            background: #2d3748;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .url-display {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            max-width: 100%;
            display: block;
        }
        .section-header {
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .param-table {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        .param-key {
            font-weight: bold;
            color: #495057;
        }
        .param-value {
            word-break: break-all;
        }
        .loading-spinner {
            text-align: center;
            padding: 60px;
        }
        .error-message {
            text-align: center;
            padding: 60px;
            color: #dc3545;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
        }
        .code-container {
            position: relative;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-network-wired me-2"></i>
                Wildlink Proxy Monitor
            </a>
            <div class="navbar-nav ms-auto">
                <button id="prevLog" class="btn btn-outline-light me-2" onclick="navigateLog('prev')" title="Previous Log">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <button id="nextLog" class="btn btn-outline-light me-2" onclick="navigateLog('next')" title="Next Log">
                    <i class="fas fa-chevron-right"></i>
                </button>
                <a class="nav-link" href="/">
                    <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                </a>
                <a class="nav-link" href="/logs">
                    <i class="fas fa-list me-1"></i>Logs
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>
                        <i class="fas fa-file-alt me-2"></i>
                        Log Detail
                    </h1>
                        <a href="/" class="btn btn-outline-primary me-2">
                            <i class="fas fa-tachometer-alt me-1"></i>Back to Dashboard
                        </a>
                        <a href="/logs" class="btn btn-outline-primary">
                            <i class="fas fa-arrow-left me-1"></i>Back to Logs
                        </a>
                </div>
            </div>
        </div>


        <div id="log-content">
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin fa-3x"></i>
                <p class="mt-3">Loading log details...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const logId = '{{ log_id }}';

        // Format timestamp
        function formatTimestamp(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        // Get method badge class
        function getMethodBadge(method) {
            const badges = {
                'GET': 'bg-success',
                'POST': 'bg-primary',
                'PUT': 'bg-warning text-dark',
                'DELETE': 'bg-danger',
                'PATCH': 'bg-info',
                'OPTIONS': 'bg-secondary'
            };
            return badges[method] || 'bg-secondary';
        }

        // Get status badge class
        function getStatusBadge(statusCode) {
            if (!statusCode) return 'bg-warning text-dark';
            if (statusCode >= 200 && statusCode < 300) return 'bg-success';
            if (statusCode >= 300 && statusCode < 400) return 'bg-info';
            if (statusCode >= 400 && statusCode < 500) return 'bg-warning text-dark';
            if (statusCode >= 500) return 'bg-danger';
            return 'bg-secondary';
        }

        // Format JSON with syntax highlighting
        function formatJSON(obj) {
            if (!obj) return '<em class="text-muted">None</em>';
            try {
                return JSON.stringify(obj, null, 2);
            } catch (e) {
                return String(obj);
            }
        }

        // Create parameter table
        function createParamTable(params) {
            if (!params || Object.keys(params).length === 0) {
                return '<em class="text-muted">None</em>';
            }
            
            return `
                <table class="table table-sm param-table">
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>Value</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.entries(params).map(([key, value]) => `
                            <tr>
                                <td class="param-key">${key}</td>
                                <td class="param-value">${value}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Copy to clipboard
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Show success feedback
                const btn = event.target.closest('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check me-1"></i>Copied!';
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-success');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-outline-secondary');
                }, 2000);
            });
        }

        // Render log detail
        function renderLogDetail(log) {
            const container = document.getElementById('log-content');
            
            container.innerHTML = `
                <!-- Log Information Card -->
                <div class="detail-card">
                    <h3 class="section-header">
                        <i class="fas fa-info-circle me-2"></i>Log Information
                    </h3>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Taken:</strong> ${formatTimestamp(log.timestamp)}</p>
                            <p><strong>Method:</strong> <span class="badge method-badge ${getMethodBadge(log.method)}">${log.method}</span></p>
                            <p><strong>Status:</strong> 
                                ${log.completed ? 
                                    `<span class="badge status-badge ${getStatusBadge(log.statusCode)}">${log.statusCode}</span>` :
                                    `<span class="badge status-badge bg-warning text-dark">Pending</span>`
                                }
                            </p>
                            <p><strong>URL:</strong></p>
                            <div class="url-display">
                                <a href="${log.url}" target="_blank" class="text-decoration-none">${log.url}</a>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6><i class="fas fa-download me-2"></i>Actions</h6>
                            <button class="btn btn-sm btn-outline-primary me-2" onclick="downloadLogData()">
                                <i class="fas fa-download me-1"></i>Download JSON
                            </button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="copyLogData()">
                                <i class="fas fa-copy me-1"></i>Copy to Clipboard
                            </button>
                        </div>
                    </div>
                    <div class="mt-3">
                        <h6><i class="fas fa-code me-2"></i>Log Data</h6>
                        <pre class="code-block">${JSON.stringify({
                            timestamp: log.timestamp,
                            logId: log.id,
                            method: log.method,
                            url: log.url,
                            status: log.statusCode,
                            headers: log.headers,
                            queryParams: log.queryParams,
                            requestBody: log.requestBody
                        }, null, 2)}</pre>
                    </div>
                </div>

                <!-- Query Parameters -->
                <div class="detail-card">
                    <h3 class="section-header">
                        <i class="fas fa-search me-2"></i>Query Parameters
                    </h3>
                    <div class="row">
                        <div class="col-md-6">
                            <h5>All Parameters</h5>
                            ${createParamTable(log.queryParams)}
                        </div>
                        <div class="col-md-6">
                            <h5>Important Parameters</h5>
                            ${createParamTable(log.importantParams)}
                        </div>
                    </div>
                </div>

                <!-- Request Headers -->
                <div class="detail-card">
                    <h3 class="section-header">
                        <i class="fas fa-arrow-up me-2"></i>Request Headers
                    </h3>
                    <div class="code-container">
                        <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyToClipboard('${formatJSON(log.headers).replace(/'/g, "\\'")}')">
                            <i class="fas fa-copy me-1"></i>Copy
                        </button>
                        <pre class="json-viewer">${formatJSON(log.headers)}</pre>
                    </div>
                </div>

                <!-- Request Body -->
                ${log.requestBody ? `
                    <div class="detail-card">
                        <h3 class="section-header">
                            <i class="fas fa-file-code me-2"></i>Request Body
                        </h3>
                        <div class="code-container">
                            <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyToClipboard('${log.requestBody.replace(/'/g, "\\'")}')">
                                <i class="fas fa-copy me-1"></i>Copy
                            </button>
                            <pre class="json-viewer">${log.requestBody}</pre>
                        </div>
                    </div>
                ` : ''}

                <!-- Response Headers -->
                ${log.responseHeaders ? `
                    <div class="detail-card">
                        <h3 class="section-header">
                            <i class="fas fa-arrow-down me-2"></i>Response Headers
                        </h3>
                        <div class="code-container">
                            <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyToClipboard('${formatJSON(log.responseHeaders).replace(/'/g, "\\'")}')">
                                <i class="fas fa-copy me-1"></i>Copy
                            </button>
                            <pre class="json-viewer">${formatJSON(log.responseHeaders)}</pre>
                        </div>
                    </div>
                ` : ''}

                <!-- Response Body -->
                ${log.responseBody ? `
                    <div class="detail-card">
                        <h3 class="section-header">
                            <i class="fas fa-file-alt me-2"></i>Response Body
                        </h3>
                        <div class="code-container">
                            <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyToClipboard('${log.responseBody.replace(/'/g, "\\'")}')">
                                <i class="fas fa-copy me-1"></i>Copy
                            </button>
                            <pre class="json-viewer">${log.responseBody}</pre>
                        </div>
                    </div>
                ` : ''}

                <!-- Raw JSON -->
                <div class="detail-card">
                    <h3 class="section-header">
                        <i class="fas fa-code me-2"></i>Raw JSON
                    </h3>
                    <div class="code-container">
                        <button class="btn btn-sm btn-outline-secondary copy-btn" onclick="copyToClipboard('${formatJSON(log).replace(/'/g, "\\'")}')">
                            <i class="fas fa-copy me-1"></i>Copy
                        </button>
                        <pre class="json-viewer">${formatJSON(log)}</pre>
                    </div>
                </div>
            `;

            // No syntax highlighting needed - using simple pre-formatted text
            
            // Store log data globally for snapshot functionality
            window.logData = log;
        }

        // Navigation and snapshot variables
        let allLogs = [];
        let currentLogIndex = -1;

        // Navigate between logs
        async function navigateLog(direction) {
            if (allLogs.length === 0) {
                // Fetch all logs first
                try {
                    const response = await fetch('/api/logs?limit=1000');
                    allLogs = await response.json();
                    currentLogIndex = allLogs.findIndex(log => log.id === logId);
                } catch (error) {
                    console.error('Error fetching logs:', error);
                    return;
                }
            }

            let newIndex;
            if (direction === 'next') {
                newIndex = currentLogIndex + 1;
                if (newIndex >= allLogs.length) newIndex = 0; // Loop to beginning
            } else {
                newIndex = currentLogIndex - 1;
                if (newIndex < 0) newIndex = allLogs.length - 1; // Loop to end
            }

            const newLogId = allLogs[newIndex].id;
            window.location.href = `/log/${newLogId}`;
        }

        // Download log data as JSON file
        function downloadLogData() {
            if (!window.logData) return;
            
            const logSnapshot = {
                timestamp: window.logData.timestamp,
                logId: window.logData.id,
                method: window.logData.method,
                url: window.logData.url,
                status: window.logData.statusCode,
                headers: window.logData.headers,
                queryParams: window.logData.queryParams,
                requestBody: window.logData.requestBody
            };
            
            const blob = new Blob([JSON.stringify(logSnapshot, null, 2)], 
                                { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `log-${window.logData.id}-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Copy log data to clipboard
        function copyLogData() {
            if (!window.logData) return;
            
            const logSnapshot = {
                timestamp: window.logData.timestamp,
                logId: window.logData.id,
                method: window.logData.method,
                url: window.logData.url,
                status: window.logData.statusCode,
                headers: window.logData.headers,
                queryParams: window.logData.queryParams,
                requestBody: window.logData.requestBody
            };
            
            navigator.clipboard.writeText(JSON.stringify(logSnapshot, null, 2))
                .then(() => {
                    // Show success feedback
                    const button = event.target.closest('button');
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check me-1"></i>Copied!';
                    button.className = 'btn btn-sm btn-success';
                    
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.className = 'btn btn-sm btn-outline-secondary';
                    }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                    alert('Failed to copy to clipboard');
                });
        }

        // Fetch log detail
        async function fetchLogDetail() {
            try {
                const response = await fetch(`/api/log/${logId}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const log = await response.json();
                
                if (log.error) {
                    throw new Error(log.error);
                }
                
                renderLogDetail(log);
                
            } catch (error) {
                console.error('Error fetching log detail:', error);
                document.getElementById('log-content').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                        <h4>Error Loading Log</h4>
                        <p>${error.message}</p>
                        <a href="/logs" class="btn btn-primary mt-3">
                            <i class="fas fa-arrow-left me-1"></i>Back to Logs
                        </a>
                    </div>
                `;
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            // Only handle keys if no input/textarea is focused
            if (document.activeElement.tagName === 'INPUT' || 
                document.activeElement.tagName === 'TEXTAREA') {
                return;
            }
            
            if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                event.preventDefault();
                navigateLog('prev');
            } else if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                event.preventDefault();
                navigateLog('next');
            } else if (event.key === 'Escape') {
                event.preventDefault();
                // Go back to logs page
                window.location.href = '/logs';
            }
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            fetchLogDetail();
        });
    </script>
</body>
</html>
