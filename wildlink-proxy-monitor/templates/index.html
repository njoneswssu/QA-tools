<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlink Proxy Monitor - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 400px;
        }
        .chart-container canvas {
            max-height: 350px !important;
            width: 100% !important;
        }
        @media (max-width: 768px) {
            .chart-container {
                min-height: 300px;
                padding: 15px;
            }
            .chart-container canvas {
                max-height: 250px !important;
            }
        }
        .activity-item {
            border-left: 4px solid #667eea;
            padding: 10px 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 0 10px 10px 0;
            transition: all 0.2s ease;
        }
        .activity-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .method-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 20px;
        }
        .status-success { color: #28a745; }
        .status-error { color: #dc3545; }
        .status-pending { color: #ffc107; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-network-wired me-2"></i>
                Wildlink Proxy Monitor
            </a>
            <div class="navbar-nav ms-auto">
                <button id="refresh-btn" class="btn btn-outline-light btn-sm me-2">
                    <i class="fas fa-sync-alt me-1"></i>Refresh Now
                </button>
                <button id="toggle-auto-refresh" class="btn btn-outline-light btn-sm me-3">
                    <i class="fas fa-pause me-1"></i>Pause Auto-refresh
                </button>
                <a class="nav-link" href="/">
                    <i class="fas fa-tachometer-alt me-1"></i>Dashboard
                </a>
                <a class="nav-link" href="/logs">
                    <i class="fas fa-list me-1"></i>Logs
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <i class="fas fa-chart-line me-2"></i>
                    Network Traffic Dashboard
                </h1>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row" id="stats-cards">
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="total-requests">-</h3>
                    <p class="mb-0">Total Requests</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="completed-requests">-</h3>
                    <p class="mb-0">Completed</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="pending-requests">-</h3>
                    <p class="mb-0">Pending</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center">
                    <h3 id="log-file-size">-</h3>
                    <p class="mb-0">Log Size</p>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Domain Breakdown Chart -->
            <div class="col-md-6">
                <div class="chart-container">
                    <h4><i class="fas fa-globe me-2"></i>Domain Breakdown</h4>
                    <canvas id="domainChart" width="400" height="300"></canvas>
                </div>
            </div>

            <!-- Method Breakdown Chart -->
            <div class="col-md-6">
                <div class="chart-container">
                    <h4><i class="fas fa-exchange-alt me-2"></i>HTTP Methods</h4>
                    <canvas id="methodChart" width="400" height="300"></canvas>
                </div>
            </div>
        </div>

        <!-- Status Code Breakdown -->
        <div class="row">
            <div class="col-md-6">
                <div class="chart-container">
                    <h4><i class="fas fa-code me-2"></i>Status Codes</h4>
                    <canvas id="statusChart" width="400" height="300"></canvas>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="col-md-6">
                <div class="chart-container">
                    <h4><i class="fas fa-clock me-2"></i>Recent Activity</h4>
                    <div id="recent-activity" style="max-height: 400px; overflow-y: auto;">
                        <div class="text-center text-muted">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Log Details Modal -->
    <div class="modal fade" id="logDetailsModal" tabindex="-1" aria-labelledby="logDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logDetailsModalLabel">
                        <i class="fas fa-info-circle me-2"></i>Log Details
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="logDetailsContent">
                    <div class="text-center">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p class="mt-2">Loading log details...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let autoRefreshInterval;
        let autoRefreshEnabled = true;
        let domainChart, methodChart, statusChart;

        // Initialize charts
        function initCharts() {
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 300 // Faster animations
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            padding: 10
                        }
                    }
                },
                layout: {
                    padding: 10
                }
            };

            // Domain chart
            const domainCtx = document.getElementById('domainChart').getContext('2d');
            domainChart = new Chart(domainCtx, {
                type: 'doughnut',
                data: { 
                    labels: ['No Data'], 
                    datasets: [{ 
                        data: [1], 
                        backgroundColor: ['#e9ecef'],
                        borderWidth: 1,
                        borderColor: ['#dee2e6']
                    }] 
                },
                options: chartOptions
            });

            // Method chart
            const methodCtx = document.getElementById('methodChart').getContext('2d');
            methodChart = new Chart(methodCtx, {
                type: 'bar',
                data: { 
                    labels: ['No Data'], 
                    datasets: [{ 
                        data: [1], 
                        backgroundColor: '#e9ecef',
                        label: 'HTTP Methods'
                    }] 
                },
                options: {
                    ...chartOptions,
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true,
                            display: true
                        },
                        x: {
                            display: true
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                }
            });

            // Status chart
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            statusChart = new Chart(statusCtx, {
                type: 'pie',
                data: { 
                    labels: ['No Data'], 
                    datasets: [{ 
                        data: [1], 
                        backgroundColor: ['#e9ecef'],
                        borderWidth: 1,
                        borderColor: ['#dee2e6']
                    }] 
                },
                options: chartOptions
            });
        }

        // Generate colors for charts
        function generateColors(count) {
            const colors = [
                '#667eea', '#764ba2', '#f093fb', '#f5576c',
                '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
                '#ffecd2', '#fcb69f', '#a8edea', '#fed6e3'
            ];
            return colors.slice(0, count);
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Format timestamp
        function formatTimestamp(timestamp) {
            return new Date(timestamp).toLocaleString();
        }

        // Get method badge class
        function getMethodBadge(method) {
            const badges = {
                'GET': 'bg-success',
                'POST': 'bg-primary', 
                'PUT': 'bg-warning text-dark',
                'DELETE': 'bg-danger',
                'PATCH': 'bg-info',
                'OPTIONS': 'bg-secondary'
            };
            return badges[method] || 'bg-secondary';
        }

        // Get status badge class
        function getStatusBadge(statusCode) {
            if (statusCode >= 200 && statusCode < 300) return 'bg-success';
            if (statusCode >= 300 && statusCode < 400) return 'bg-info';
            if (statusCode >= 400 && statusCode < 500) return 'bg-warning text-dark';
            if (statusCode >= 500) return 'bg-danger';
            return 'bg-secondary';
        }

        // Get method badge class
        function getMethodBadge(method) {
            const badges = {
                'GET': 'bg-success',
                'POST': 'bg-primary',
                'PUT': 'bg-warning',
                'DELETE': 'bg-danger',
                'PATCH': 'bg-info',
                'OPTIONS': 'bg-secondary'
            };
            return badges[method] || 'bg-secondary';
        }

        // Update dashboard with stats
        function updateDashboard(stats) {
            // Update stat cards
            document.getElementById('total-requests').textContent = stats.total_requests;
            document.getElementById('completed-requests').textContent = stats.completed_requests;
            document.getElementById('pending-requests').textContent = stats.pending_requests;
            document.getElementById('log-file-size').textContent = formatFileSize(stats.log_file_size || 0);

            // Update domain chart
            const domainLabels = Object.keys(stats.domain_breakdown || {});
            const domainData = Object.values(stats.domain_breakdown || {});
            
            if (domainLabels.length === 0) {
                domainChart.data.labels = ['No Data'];
                domainChart.data.datasets[0].data = [1];
                domainChart.data.datasets[0].backgroundColor = ['#e9ecef'];
            } else {
                domainChart.data.labels = domainLabels;
                domainChart.data.datasets[0].data = domainData;
                domainChart.data.datasets[0].backgroundColor = generateColors(domainLabels.length);
            }
            domainChart.update();

            // Update method chart
            const methodLabels = Object.keys(stats.method_breakdown || {});
            const methodData = Object.values(stats.method_breakdown || {});
            
            if (methodLabels.length === 0) {
                methodChart.data.labels = ['No Data'];
                methodChart.data.datasets[0].data = [1];
                methodChart.data.datasets[0].backgroundColor = ['#e9ecef'];
                methodChart.data.datasets[0].borderColor = ['#dee2e6'];
                methodChart.data.datasets[0].borderWidth = 1;
            } else {
                methodChart.data.labels = methodLabels;
                methodChart.data.datasets[0].data = methodData;
                // Different colors for different HTTP methods
                const methodColors = methodLabels.map(method => {
                    switch(method) {
                        case 'GET': return '#28a745';
                        case 'POST': return '#007bff';
                        case 'PUT': return '#ffc107';
                        case 'DELETE': return '#dc3545';
                        case 'PATCH': return '#17a2b8';
                        default: return '#6c757d';
                    }
                });
                methodChart.data.datasets[0].backgroundColor = methodColors;
                methodChart.data.datasets[0].borderColor = methodColors.map(color => color);
                methodChart.data.datasets[0].borderWidth = 1;
            }
            methodChart.update('none'); // Use 'none' animation for better performance

            // Update status chart
            const statusLabels = Object.keys(stats.status_code_breakdown || {});
            const statusData = Object.values(stats.status_code_breakdown || {});
            
            if (statusLabels.length === 0) {
                statusChart.data.labels = ['No Data'];
                statusChart.data.datasets[0].data = [1];
                statusChart.data.datasets[0].backgroundColor = ['#e9ecef'];
            } else {
                statusChart.data.labels = statusLabels;
                statusChart.data.datasets[0].data = statusData;
                statusChart.data.datasets[0].backgroundColor = generateColors(statusLabels.length);
            }
            statusChart.update();

            // Update recent activity
            const activityContainer = document.getElementById('recent-activity');
            if (stats.recent_activity.length === 0) {
                activityContainer.innerHTML = `
                    <div class="text-center text-muted">
                        <i class="fas fa-info-circle mb-2" style="font-size: 2rem;"></i>
                        <h5>No Traffic Captured Yet</h5>
                        <p class="mb-2">To start monitoring Wildlink traffic:</p>
                        <ol class="text-start" style="display: inline-block;">
                            <li>Configure your browser proxy to <code>localhost:8080</code></li>
                            <li>Visit Wildlink domains (wildlink.me, wild.link, etc.)</li>
                            <li>Traffic will appear here automatically</li>
                        </ol>
                        <p class="mt-2"><small>Or test with: <code>curl --proxy localhost:8080 https://wildlink.me</code></small></p>
                    </div>
                `;
            } else {
                activityContainer.innerHTML = stats.recent_activity.map(activity => `
                    <div class="activity-item" onclick="showLogDetails('${activity.id}')" style="cursor: pointer;" title="Click to view full details">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <span class="badge method-badge ${getMethodBadge(activity.method)}">${activity.method}</span>
                                <strong class="ms-2">${activity.hostname}</strong>
                            </div>
                            <small class="text-muted">${formatTimestamp(activity.timestamp)}</small>
                        </div>
                        <div class="mt-1">
                            <small class="text-muted">${activity.path}</small>
                            ${activity.completed ? 
                                `<span class="status-success ms-2"><i class="fas fa-check-circle"></i> ${activity.statusCode}</span>` :
                                `<span class="status-pending ms-2"><i class="fas fa-clock"></i> Pending</span>`
                            }
                        </div>
                    </div>
                `).join('');
            }
        }

        // Fetch and update stats
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                console.log('Dashboard stats received:', stats);
                console.log('Recent activity count:', stats.recent_activity?.length || 0);
                updateDashboard(stats);
            } catch (error) {
                console.error('Error fetching stats:', error);
            }
        }

        // Toggle auto-refresh
        function toggleAutoRefresh() {
            const button = document.getElementById('toggle-auto-refresh');
            if (autoRefreshEnabled) {
                clearInterval(autoRefreshInterval);
                autoRefreshEnabled = false;
                button.innerHTML = '<i class="fas fa-play me-1"></i>Resume Auto-refresh';
                button.classList.remove('btn-outline-secondary');
                button.classList.add('btn-outline-success');
            } else {
                startAutoRefresh();
                autoRefreshEnabled = true;
                button.innerHTML = '<i class="fas fa-pause me-1"></i>Pause Auto-refresh';
                button.classList.remove('btn-outline-success');
                button.classList.add('btn-outline-secondary');
            }
        }

        // Start auto-refresh
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(fetchStats, 5000);
        }

        // Show log details in modal
        async function showLogDetails(logId) {
            const modal = new bootstrap.Modal(document.getElementById('logDetailsModal'));
            const content = document.getElementById('logDetailsContent');
            
            // Show loading state
            content.innerHTML = `
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p class="mt-2">Loading log details...</p>
                </div>
            `;
            
            modal.show();
            
            try {
                const response = await fetch(`/api/log/${logId}`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const log = await response.json();
                displayLogDetails(log);
                
            } catch (error) {
                console.error('Error fetching log details:', error);
                content.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <strong>Error loading log details:</strong> ${error.message}
                    </div>
                `;
            }
        }

        // Display log details in the modal
        function displayLogDetails(log) {
            const content = document.getElementById('logDetailsContent');
            
            content.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Taken:</strong> ${formatTimestamp(log.timestamp)}</p>
                        <p><strong>Method:</strong> <span class="badge method-badge ${getMethodBadge(log.method)}">${log.method}</span></p>
                        <p><strong>Status:</strong> 
                            ${log.completed ? 
                                `<span class="badge status-badge ${getStatusBadge(log.statusCode)}">${log.statusCode}</span>` :
                                `<span class="badge status-badge bg-warning text-dark">Pending</span>`
                            }
                        </p>
                        <p><strong>URL:</strong> <a href="${log.url}" target="_blank" class="text-decoration-none">${log.url}</a></p>
                    </div>
                    <div class="col-md-6">
                        <h6><i class="fas fa-download me-2"></i>Actions</h6>
                        <button class="btn btn-sm btn-outline-success me-2" onclick="navigateToLog()">
                            <i class="fas fa-external-link-alt me-1"></i>Navigate to Log
                        </button>
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="downloadModalLogData()">
                            <i class="fas fa-download me-1"></i>Download JSON
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="copyModalLogData()">
                            <i class="fas fa-copy me-1"></i>Copy to Clipboard
                        </button>
                    </div>
                </div>
                <div class="mt-3">
                    <h6><i class="fas fa-code me-2"></i>Log Data</h6>
                    <pre class="bg-light p-3 rounded" style="max-height: 300px; overflow-y: auto;"><code>${JSON.stringify({
                        timestamp: log.timestamp,
                        logId: log.id,
                        method: log.method,
                        url: log.url,
                        status: log.statusCode,
                        headers: log.headers,
                        queryParams: log.queryParams,
                        requestBody: log.requestBody
                    }, null, 2)}</code></pre>
                </div>
            `;
            
            // Store log data for modal actions
            window.currentModalLog = log;
        }

        // Download log data from modal
        function downloadModalLogData() {
            if (!window.currentModalLog) return;
            
            const logSnapshot = {
                timestamp: window.currentModalLog.timestamp,
                logId: window.currentModalLog.id,
                method: window.currentModalLog.method,
                url: window.currentModalLog.url,
                status: window.currentModalLog.statusCode,
                headers: window.currentModalLog.headers,
                queryParams: window.currentModalLog.queryParams,
                requestBody: window.currentModalLog.requestBody
            };
            
            const blob = new Blob([JSON.stringify(logSnapshot, null, 2)], 
                                { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `log-${window.currentModalLog.id}-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Copy log data from modal
        function copyModalLogData() {
            if (!window.currentModalLog) return;
            
            const logSnapshot = {
                timestamp: window.currentModalLog.timestamp,
                logId: window.currentModalLog.id,
                method: window.currentModalLog.method,
                url: window.currentModalLog.url,
                status: window.currentModalLog.statusCode,
                headers: window.currentModalLog.headers,
                queryParams: window.currentModalLog.queryParams,
                requestBody: window.currentModalLog.requestBody
            };
            
            navigator.clipboard.writeText(JSON.stringify(logSnapshot, null, 2))
                .then(() => {
                    // Show success feedback
                    const button = event.target.closest('button');
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check me-1"></i>Copied!';
                    button.className = 'btn btn-sm btn-success';
                    
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.className = 'btn btn-sm btn-outline-secondary';
                    }, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                    alert('Failed to copy to clipboard');
                });
        }

        // Navigate to log detail page from modal
        function navigateToLog() {
            if (!window.currentModalLog) return;
            window.location.href = `/log/${window.currentModalLog.id}`;
        }


        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            fetchStats();
            startAutoRefresh();
            
            // Event listeners
            document.getElementById('refresh-btn').addEventListener('click', fetchStats);
            document.getElementById('toggle-auto-refresh').addEventListener('click', toggleAutoRefresh);
        });
    </script>
</body>
</html>
