<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Logs API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log-item { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🧪 Logs API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing API...</p>';
            
            try {
                console.log('Fetching from: http://localhost:5001/api/logs?limit=5');
                const response = await fetch('http://localhost:5001/api/logs?limit=5');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const logs = await response.json();
                console.log('Received logs:', logs);
                
                results.innerHTML = `
                    <div class="success">
                        <h3>✅ API Working!</h3>
                        <p>Found ${logs.length} logs</p>
                    </div>
                    <div>
                        <h4>Sample Logs:</h4>
                        ${logs.map((log, i) => `
                            <div class="log-item">
                                <strong>${i + 1}. ${log.method} ${log.hostname}</strong><br>
                                Status: ${log.statusCode}<br>
                                Time: ${log.timestamp}<br>
                                ID: ${log.id}
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (error) {
                console.error('API Error:', error);
                results.innerHTML = `
                    <div class="error">
                        <h3>❌ API Error</h3>
                        <p>${error.message}</p>
                        <p>Check browser console for details</p>
                    </div>
                `;
            }
        }
        
        // Auto-test on load
        window.onload = testAPI;
    </script>
</body>
</html>
