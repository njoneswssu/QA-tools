<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Test Results Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <div class="header-main">
                <h1><i class="fas fa-chart-line"></i> Merchant Test Results Dashboard</h1>
                <div class="header-nav">
                    <a href="/tester" class="nav-link">
                        <i class="fas fa-rocket"></i> API Merchant Tester
                    </a>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-tested">0</div>
                    <div class="stat-label">Total Tested</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-number" id="total-successful">0</div>
                    <div class="stat-label">Successful</div>
                </div>
                <div class="stat-card flagged">
                    <div class="stat-number" id="total-flagged">0</div>
                    <div class="stat-label">Flagged</div>
                </div>
                <div class="stat-card user-passed">
                    <div class="stat-number" id="total-user-passed">0</div>
                    <div class="stat-label">User Passed</div>
                </div>
            </div>
        </header>

        <div class="controls-section">
            <div class="filters">
                <div class="filter-group">
                    <label for="session-filter">Test Session:</label>
                    <select id="session-filter">
                        <option value="">All Sessions</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="status-filter">Status:</label>
                    <select id="status-filter">
                        <option value="">All Statuses</option>
                        <option value="success">Successful</option>
                        <option value="flagged">Flagged</option>
                        <option value="user_passed">User Passed</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="category-filter">Category:</label>
                    <select id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="search-filter">Search:</label>
                    <input type="text" id="search-filter" placeholder="Search merchant name or URL...">
                </div>
                
                <div class="filter-group">
                    <label for="date-filter">Date Range:</label>
                    <input type="date" id="date-from">
                    <span>to</span>
                    <input type="date" id="date-to">
                </div>
            </div>
            
            <div class="action-buttons">
                <button id="refresh-btn" class="btn btn-primary">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button id="export-btn" class="btn btn-secondary">
                    <i class="fas fa-download"></i> Export CSV
                </button>
                <button id="clear-filters-btn" class="btn btn-outline">
                    <i class="fas fa-times"></i> Clear Filters
                </button>
                <button id="reset-database-btn" class="btn btn-danger" title="Reset all database data">
                    <i class="fas fa-database"></i> Reset Database
                </button>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <h2>Test Results</h2>
                <div class="results-info">
                    <span id="results-count">0 results</span>
                    <div class="view-toggle">
                        <button id="table-view-btn" class="view-btn active">
                            <i class="fas fa-table"></i> Table
                        </button>
                        <button id="card-view-btn" class="view-btn">
                            <i class="fas fa-th-large"></i> Cards
                        </button>
                    </div>
                </div>
            </div>

            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> Loading...
            </div>

            <!-- Table View -->
            <div id="table-view" class="table-container">
                <table class="results-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="merchant_name">
                                Merchant Name <i class="fas fa-sort"></i>
                            </th>
                            <th class="sortable" data-sort="test_status">
                                Status <i class="fas fa-sort"></i>
                            </th>
                            <th class="sortable" data-sort="primary_category">
                                Category <i class="fas fa-sort"></i>
                            </th>
                            <th class="sortable" data-sort="tested_at">
                                Tested At <i class="fas fa-sort"></i>
                            </th>
                            <th>URL</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody">
                        <!-- Results will be populated here -->
                    </tbody>
                </table>
            </div>

            <!-- Card View -->
            <div id="card-view" class="card-container" style="display: none;">
                <!-- Cards will be populated here -->
            </div>

            <div class="pagination">
                <button id="prev-page" class="btn btn-outline" disabled>
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span id="page-info">Page 1 of 1</span>
                <button id="next-page" class="btn btn-outline" disabled>
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal for detailed view -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Merchant Details</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Details will be populated here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
