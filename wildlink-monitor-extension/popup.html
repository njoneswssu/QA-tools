<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildlink Traffic Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 Wildlink Monitor</h1>
      <div class="status" id="status">
        <span class="status-indicator active"></span>
        <span>Monitoring Active</span>
      </div>
    </header>
    
    <div class="stats-section">
      <div class="stat-card">
        <div class="stat-value" id="totalRequests">0</div>
        <div class="stat-label">Total Requests</div>
      </div>
    </div>
    
    <div class="actions">
      <button id="viewDashboard" class="btn btn-primary">View Dashboard</button>
      <button id="clearLogs" class="btn btn-secondary">Clear Logs</button>
    </div>
    
    <div class="recent-section">
      <h2>Recent Wildlink Traffic</h2>
      <div id="recentLogs" class="logs-list">
        <div class="empty-state">No Wildlink traffic captured yet. Browse normally and traffic will be captured automatically.</div>
      </div>
    </div>
    
    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Request Details</h2>
          <span class="close-modal" id="closeModal">&times;</span>
        </div>
        <div class="modal-body" id="modalBody">
          <!-- Details will be inserted here -->
        </div>
      </div>
    </div>
    
    <div class="footer">
      <small>Monitoring: wild.link, wildlink.me, wildlink.ai, wfi.re</small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
