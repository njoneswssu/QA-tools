<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 300px;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }
        
        .button {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 172, 254, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .features {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }
        
        .features h2 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .features ul {
            list-style: none;
            padding: 0;
        }
        
        .features li {
            padding: 5px 0;
            color: #666;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .features li::before {
            content: '✓';
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>XML Converter</h1>
        <p class="description">Convert XML order status formats and search WSCO numbers</p>
        
        <button class="button" id="openConverter">Open XML Converter</button>
        
        <div class="features">
            <h2>Features:</h2>
            <ul>
                <li>Convert order numbers to XML</li>
                <li>Convert between XML formats</li>
                <li>WSCO search with XML viewer</li>
                <li>Chrome-style XML tree display</li>
            </ul>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
