<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Extension Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .icon-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .icon-wrapper {
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #5568d3;
        }
        h1 {
            color: #333;
        }
        .instructions {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
    </style>
</head>
<body>
    <h1>🎨 Excel Color Clearer - Icon Generator</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click "Generate Icons" to create all icon sizes</li>
            <li>Right-click each icon and "Save Image As..."</li>
            <li>Save them in the <code>icons/</code> folder with the names shown below each icon</li>
        </ol>
    </div>

    <button onclick="generateAllIcons()">Generate Icons</button>
    <button onclick="downloadAllIcons()">Download All Icons</button>

    <div class="icon-container" id="iconContainer"></div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            const scale = size / 128;
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw Excel-like grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1 * scale;
            
            const gridSize = 3;
            const cellSize = (size * 0.6) / gridSize;
            const gridX = size * 0.2;
            const gridY = size * 0.2;
            
            // Draw grid lines
            for (let i = 0; i <= gridSize; i++) {
                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(gridX + i * cellSize, gridY);
                ctx.lineTo(gridX + i * cellSize, gridY + gridSize * cellSize);
                ctx.stroke();
                
                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(gridX, gridY + i * cellSize);
                ctx.lineTo(gridX + gridSize * cellSize, gridY + i * cellSize);
                ctx.stroke();
            }
            
            // Draw colored cells
            ctx.fillStyle = '#ff6b6b';
            ctx.fillRect(gridX + cellSize * 0.1, gridY + cellSize * 0.1, cellSize * 0.8, cellSize * 0.8);
            
            ctx.fillStyle = '#4ecdc4';
            ctx.fillRect(gridX + cellSize * 1.1, gridY + cellSize * 1.1, cellSize * 0.8, cellSize * 0.8);
            
            // Draw eraser/brush icon overlay
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 3 * scale;
            ctx.lineCap = 'round';
            
            const eraserX = size * 0.65;
            const eraserY = size * 0.65;
            const eraserSize = size * 0.25;
            
            // Eraser shape
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(eraserX, eraserY, eraserSize / 2, 0, Math.PI * 2);
            ctx.fill();
            
            // X mark inside eraser
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2 * scale;
            ctx.beginPath();
            ctx.moveTo(eraserX - eraserSize * 0.2, eraserY - eraserSize * 0.2);
            ctx.lineTo(eraserX + eraserSize * 0.2, eraserY + eraserSize * 0.2);
            ctx.moveTo(eraserX + eraserSize * 0.2, eraserY - eraserSize * 0.2);
            ctx.lineTo(eraserX - eraserSize * 0.2, eraserY + eraserSize * 0.2);
            ctx.stroke();
        }

        function generateAllIcons() {
            const sizes = [16, 32, 48, 128];
            const container = document.getElementById('iconContainer');
            container.innerHTML = '';
            
            sizes.forEach(size => {
                const wrapper = document.createElement('div');
                wrapper.className = 'icon-wrapper';
                
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `icon${size}`;
                
                drawIcon(canvas, size);
                
                const label = document.createElement('p');
                label.textContent = `icon${size}.png (${size}x${size})`;
                
                wrapper.appendChild(canvas);
                wrapper.appendChild(label);
                container.appendChild(wrapper);
            });
        }

        function downloadAllIcons() {
            const sizes = [16, 32, 48, 128];
            
            sizes.forEach(size => {
                const canvas = document.getElementById(`icon${size}`);
                if (canvas) {
                    canvas.toBlob(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `icon${size}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    });
                }
            });
        }

        // Generate icons on page load
        window.addEventListener('load', generateAllIcons);
    </script>
</body>
</html>
