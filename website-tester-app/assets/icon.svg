<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" stroke="#fff" stroke-width="8"/>
  
  <!-- Globe/World icon -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fff" stroke-width="6"/>
  
  <!-- Vertical lines (longitude) -->
  <ellipse cx="256" cy="256" rx="80" ry="160" fill="none" stroke="#fff" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="40" ry="160" fill="none" stroke="#fff" stroke-width="3"/>
  
  <!-- Horizontal lines (latitude) -->
  <line x1="96" y1="256" x2="416" y2="256" stroke="#fff" stroke-width="4"/>
  <line x1="136" y1="176" x2="376" y2="176" stroke="#fff" stroke-width="3"/>
  <line x1="136" y1="336" x2="376" y2="336" stroke="#fff" stroke-width="3"/>
  
  <!-- Check mark overlay -->
  <g transform="translate(320, 320)">
    <circle cx="40" cy="40" r="35" fill="#4CAF50" stroke="#fff" stroke-width="3"/>
    <path d="M25 40 L35 50 L55 30" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Search/magnifying glass -->
  <g transform="translate(160, 160)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#fff" stroke-width="4"/>
    <line x1="17" y1="17" x2="35" y2="35" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
